name: Daily Data Update

on:
  schedule:
    # 매일 오전 9시 10분 KST (= UTC 00:10) 실행 — 한국은행 ECOS가 전영업일 환율을 00:00 KST 이후 확정 공시
    - cron: "10 0 * * 1-5"
  workflow_dispatch:  # 수동 실행 허용 (GitHub Actions 탭 > Run workflow)

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # data/*.csv 커밋을 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily data fetch
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python fetch_daily_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 변경이 없으면 커밋 스킵
          if git diff --cached --quiet; then
            echo "데이터 변경 없음 — 커밋 스킵"
          else
            DATE=$(TZ=Asia/Seoul date '+%Y-%m-%d')
            git commit -m "data: auto-update ${DATE} [skip ci]"
            git push
          fi
